  <script>"use strict";
(() => {
  const d = JSON.parse(document.getElementById("demo-data").textContent);
  const report = document.body.dataset.mode === "report";
  const allWaiting = d.environments.every(s => s.status === "WAITING");
  const noOracle = d.environments.every(s => s.verification_source === "NOT_AVAILABLE");
  const currentExecution = d.active_environment || (allWaiting ? "None · waiting at approval" : "None currently executing");
  const approvalDescription = d.approval_complete ? "Independent OWNER and DBA approval evidence is recorded." : "OWNER and DBA approval evidence remains incomplete.";
  const runtimeDescription = d.runtime_proven ? "Every environment has recorded execution and Oracle acceptance. The migration is verified." : allWaiting ? "The ODC batch exists. Human approval is incomplete. No migration stage has executed." : "The migration is not accepted as complete. Review recorded stage statuses and independent Oracle checks.";
  const e = value => String(value ?? "Not available")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const label = value => String(value).replaceAll("_", " ");
  const source = value => `<span class="badge ${value === "LIVE" ? "live" : value === "FIXTURE" ? "fixture" : "na"}">${e(label(value))}</span>`;
  const badge = value => `<span class="badge ${["PASS","VERIFIED","APPROVED","SUBMITTED","MERGED","IMPLEMENTED"].includes(value) ? "good" : ["FAILED","FAIL","INVALID","CORRECTION_REQUIRED"].includes(value) ? "bad" : ["WAITING_APPROVAL","WAITING","PENDING","EXECUTING","IN_PROGRESS"].includes(value) ? "wait" : "neutral"}">${e(label(value))}</span>`;
  const mono = value => `<code>${e(value)}</code>`;
  const date = value => !value ? "Not started" : String(value).startsWith("SAMPLE") ? "Fixture timestamp" : new Date(value).toLocaleString("en-GB", {timeZone:"UTC",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) + " UTC";
  const link = (path, text, cls = "") => `<a class="${cls}" href="${e(path)}">${e(text)}</a>`;
  const local = path => {
    if (!/^(demo|evidence|evaluation|scripts)\/[A-Za-z0-9_./-]+$/.test(path) || path.includes("..")) return "data/demo-status.json";
    return "../../" + path;
  };
  const githubLink = (url, text) => /^https:\/\/github\.com\//.test(url || "") ? `<a href="${e(url)}" target="_blank" rel="noopener noreferrer">${e(text)} ↗</a>` : e(text);
  const section = (id, n, title, subtitle, content, right = "") => `<section id="${id}" class="section"><div class="section-head"><div><span class="number">${n}</span><h2>${title}</h2><p>${subtitle}</p></div>${right}</div>${content}</section>`;
  const kv = entries => `<dl class="kv">${entries.map(([key,value]) => `<dt>${key}</dt><dd>${value}</dd>`).join("")}</dl>`;
  const legend = `<div class="legend"><span class="label">Evidence key</span>${source("LIVE")}${source("FIXTURE")}${source("NOT_AVAILABLE")}</div>`;
  const snapshot = `<div class="snapshot">${legend}<span><strong>Runtime snapshot</strong> · ${e(date(d.observed_at))}</span></div>`;
  const navItems = [["problem","The problem"],["architecture","Architecture"],["release","Current release"],["github","GitHub validation"],["approvals","Review & approval"],["rollout","Environment rollout"],["verification","Oracle verification"],["scenarios","Failure & correction"],["audit","Evidence & report"],["comparison","Before vs after"],["decision","POC decision"]];
  const dbIcon = `<svg width="21" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7" stroke="currentColor" stroke-width="1.6"/></svg>`;
  const sidebar = `<aside class="sidebar"><a class="brand" href="#top"><span class="mark">${dbIcon}</span><span>Migration POC<small>ENGINEERING DEMO</small></span></a><div class="nav-label">THE RELEASE STORY</div><nav class="nav" aria-label="Dashboard sections">${navItems.map(([id,title],i) => `<a href="#${id}"><span>${String(i+1).padStart(2,"0")}</span>${title}</a>`).join("")}</nav><div class="sidebar-bottom">${source("LIVE")} <span class="tag">+ fixtures</span><p>Offline evidence snapshot<br>08 October 2026<br>MOCKPROD is a POC schema.</p></div></aside>`;
  const topbar = `<header class="topbar"><div class="topbar-title">DATABASE MIGRATION POC<span>customer-profile / Oracle</span></div><div class="top-actions">${link("migration-report.html","Migration report","btn")}<button class="btn primary" id="presentation" aria-pressed="false">Presentation mode</button></div></header>`;
  const hero = `<section class="hero" id="top"><div><div class="eyebrow">DATABASE MIGRATION POC</div><h1>One release.<br>Every environment.<br><em>A traceable result.</em></h1><p>From reviewed SQL to an approved ODC rollout, independently checked in Oracle and captured in one report.</p><div class="hero-tags"><span class="badge dark">GITHUB → ODC → ORACLE</span><span class="badge dark">DEV → SIT → UAT → MOCKPROD</span></div></div><div class="hero-status"><div class="tag">CURRENT RELEASE · ${e(d.release)}</div><h2>${e(label(d.overall_status))}</h2><p>${e(runtimeDescription)}</p><div class="hero-kv"><div><small>APPLICATION</small><strong>${e(d.application)}</strong></div><div><small>ODC BATCH</small><strong>${e(d.odc_batch)} · ${e(d.native_status)}</strong></div><div><small>SOURCE</small><strong>${e(d.source)}</strong></div><div><small>CURRENT EXECUTION</small><strong>${e(currentExecution)}</strong></div></div></div></section>`;
  const problem = section("problem","01 / THE PROBLEM","SQL changes need a reliable handoff.","A script is easy to share. The target, approvals and final database result are harder to track.",`<div class="panel problem-panel"><div><h3>Today: a manual chain</h3><p class="muted small">Source, decisions and execution evidence live in different places. The DBA carries the context from step to step.</p></div><div class="manual-chain">${["Developer","SQL file","Chat / email","DBA","DBeaver","Select DB","Run SQL","Screenshot / log"].map((s,i) => `${i ? "<i>→</i>" : ""}<span>${s}</span>`).join("")}</div></div>`);
  const architecture = section("architecture","02 / PROPOSED ARCHITECTURE","Each system has a clear responsibility.","GitHub validates the release. ODC owns review and execution. Oracle tells us what actually changed.",`<div class="panel"><div class="flow">${[["01","Developer","Author SQL"],["02","GitHub PR","Review source"],["03","GitHub Actions","Validate & package"],["04","ODC","Approve & execute"],["05","Oracle","Database state"],["06","Verification","SELECT-only checks"],["07","Report","Combined evidence"]].map(([n,name,desc],i) => `${i ? '<div class="flow-arrow" aria-hidden="true">→</div>' : ""}<div class="flow-step"><div class="flow-icon">${n}</div><b>${name}</b><small>${desc}</small></div>`).join("")}</div><div class="responsibilities">${[["GitHub","Source + PR + validation + provenance"],["ODC","Inventory + review + approval + rollout + audit"],["Oracle","Actual objects, compilation, data and function results"],["Report","Combined evidence with explicit source labels"]].map(([name,desc]) => `<div class="responsibility"><b>${name}</b><p>${desc}</p></div>`).join("")}</div><div class="callout info"><strong>Execution belongs to ODC.</strong>GitHub Actions prepares and validates the package. An authorized operator continues execution in ODC; Oracle verification determines whether the migration is accepted.</div></div>`);
  const files = `<ul class="file-list">${d.files.map(f => `<li class="file-row"><span class="checkmark" aria-hidden="true">✓</span><div><a class="file-name" href="${e(local(f.path))}">${e(f.file)}</a><div class="file-meta"><span>${e(f.type)}</span><details><summary>SHA ${e(f.sha256.slice(0,12))}…</summary><code class="full-hash">${e(f.sha256)}</code></details></div></div>${badge(f.policy)}</li>`).join("")}</ul>`;
  const release = section("release","03 / CURRENT RELEASE","A reviewed package, bound to its original source.",`${e(d.application)} · ${e(d.release)} · repository ${e(d.repository)}`,`<div class="grid2"><div class="panel"><div class="release-id">${e(d.release)}</div>${kv([["Application",e(d.application)],["Release status",badge(d.overall_status)],["ODC batch",`${mono(d.odc_batch)} · ${e(d.native_status)} ${source("LIVE")}`],["Source",githubLink(`https://github.com/${d.repository}`,d.repository)],["Package source",mono(d.provenance.source_commit)],["Manifest SHA-256",mono(d.provenance.manifest_sha256)],["Combined SQL SHA",mono(d.provenance.sql_sha256)],["Package origin",`${e(d.provenance.package_origin)}; Actions run ${e(d.provenance.github_run)}`]])}<p class="provenance-note">Batch ${e(d.odc_batch)} retains source ${e(d.provenance.source_commit.slice(0,12))}. Later PR and merge commits are shown separately. The original batch is not re-created.</p></div><div class="panel"><div class="package-summary"><div class="package-number">${d.files.length}</div><div><h3>Migration files</h3><p>Ordered SQL · immutable SHA-256 · policy checked</p></div>${source("LIVE")}</div>${files}</div></div>`);
  const github = section("github","04 / GITHUB VALIDATION","Validation passed. The implementation is merged.","These are real GitHub runs. A successful fixture report job proves report generation, not a database migration.",`<div class="panel" style="margin-bottom:16px">${kv([["Implementation PR",`${githubLink(d.github.pr.html_url,`PR #${d.github.pr.number}`)} ${badge(d.github.pr.merged ? "MERGED" : d.github.pr.state.toUpperCase())}`],["Merged at",e(date(d.github.pr.merged_at))],["PR source commit",mono(d.github.pr.head_sha)],["Merge commit",mono(d.github.pr.merge_commit)],["Batch source commit",mono(d.provenance.source_commit)]])}</div><div class="grid3">${d.github.workflows.map(w => `<article class="panel metric-card"><div class="metric-top"><h3>${e(w.name)}</h3>${badge(w.status)}</div>${source(w.source)}<p style="margin-top:10px">${e(w.scope)}</p><span class="run-link">${githubLink(w.url,`Run ${w.run}`)}<br><span class="muted small">Commit ${e((w.commit || "").slice(0,12))}</span>${w.artifacts.map(a => `<br><span class="muted small">Artifact ${e(a.id)}${a.expired ? " · expired" : ""}</span>`).join("")}</span></article>`).join("")}</div><div class="validation-footer"><span>Tests <strong>${d.github.tests ? `${e(d.github.tests)} PASS` : "Count not available"}</strong></span><span>Release package <strong>${e(d.github.package_status)}</strong></span><span>Verified artifact ${githubLink(`https://github.com/${d.repository}/actions/runs/${d.github.artifact_run}/artifacts/${d.github.artifact_id}`,d.github.artifact_id)}</span>${source("LIVE")}</div><div class="callout"><strong>Authenticated Actions → ODC remains pending.</strong>Static validation and fixture rendering are implemented. The live handoff still needs its runner, protected environment, secrets and the original batch artifact.</div>`);
  const approvals = section("approvals","05 / REVIEW & APPROVAL",d.approval_complete ? "Independent approval is recorded." : "The approval gate is still open.","An executing approval node is pending review. Completed independent role and actor evidence is required to claim approval.",`<div class="panel"><div class="timeline">${d.approvals.map((a,i) => `<article class="timeline-item"><div class="timeline-dot ${a.status === "SUBMITTED" || a.status === "APPROVED" ? "complete" : ""}">${a.status === "SUBMITTED" || a.status === "APPROVED" ? "✓" : i+1}</div><h3>${e(a.role)}</h3>${badge(a.status)}<p class="actor">${e(a.actor)}</p>${source(a.source)}<p>${e(a.detail)}</p></article>`).join("")}</div></div>`);
  function pipeline(stages) {
    return `<div class="pipeline">${stages.map((s,i) => `<article class="environment ${e(s.status.toLowerCase())}"><div class="env-title"><h3>${e(s.name)}</h3><span class="env-index">0${i+1}</span></div><div class="env-status">${badge(s.status)}</div><div class="env-details"><div><small>ODC TARGET</small><strong>#${e(s.target)}</strong></div><div><small>ORACLE SCHEMA</small><span class="mono">${e(s.schema)}</span></div><div><small>NATIVE EXECUTION STATUS</small><span class="mono">${e(s.native_status)}</span></div><div><small>START TIME</small>${e(date(s.start))}</div><div><small>END TIME</small>${s.end ? e(date(s.end)) : "Not finished"}</div></div><div class="env-check"><span>Oracle verification</span>${badge(s.verification)}</div><div class="env-source"><span>Evidence source</span>${source(s.source)}</div></article>`).join("")}</div>`;
  }
  const rollout = section("rollout","06 / ENVIRONMENT ROLLOUT","Four environments. One controlled progression.",`Current execution: ${d.active_environment ? e(d.active_environment) : "none"}. Every stage is gated by human approval, manual continuation and Oracle verification.`,pipeline(d.environments) + `<div class="callout"><strong>Actual runtime: ${e(label(d.overall_status))}.</strong>${allWaiting ? "All targets are registered. No migration start/end times or completed executions exist for this batch." : "Recorded stage observations and start/end times are shown above."} ODC uses manual singleton stage order with ABORT and retry 0.</div>`,source("LIVE"));
  function verificationTable(stages) {
    return `<div class="table-wrap"><table><caption class="skip">Oracle migration acceptance checks by environment</caption><thead><tr><th scope="col">Check</th>${stages.map(s=>`<th scope="col">${e(s.name)}</th>`).join("")}</tr></thead><tbody>${Object.keys(stages[0].checks).map(check => `<tr><th scope="row" style="text-transform:none;letter-spacing:0;background:white">${e(check)}</th>${stages.map(s=>`<td>${badge(s.checks[check])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  const verification = section("verification","07 / ORACLE VERIFICATION","Execution success must be verified in Oracle.",noOracle ? "Acceptance checks cover objects, compilation errors, seed rows and the function result. No post-migration checks have run for the current release." : "Acceptance checks independently evaluate objects, compilation errors, seed rows and function results from the recorded Oracle observations.",verificationTable(d.environments)+`<div class="verification-caption"><span>Expected: 5 valid objects · 0 USER_ERRORS · 3 rows / 2 active · C0001:Demo Customer One</span>${source("NOT_AVAILABLE")}</div><div class="callout info">An ODC <code>EXECUTION_SUCCEEDED</code> status alone cannot make this panel green. Preflight checks of the empty namespace do not prove the migration.</div>`);
  const correction = `<div class="correction-flow"><div class="correction-card fail"><div class="tag" style="color:var(--red)">PRESERVED FAILED RELEASE</div><h3 style="margin-top:9px">${e(d.correction.failed_release)}</h3>${badge("CORRECTION_REQUIRED")}<p>Combined SQL SHA-256 ${mono(d.correction.failed_sha256.slice(0,16))}…</p><p>SIT fails with ORA-20042 in the fixture. The failed release and its history remain unchanged.</p></div><div class="correction-arrow" aria-hidden="true">→</div><div class="correction-card fix"><div class="tag" style="color:var(--teal)">NEW CORRECTION RELEASE</div><h3 style="margin-top:9px">${e(d.correction.release)}</h3>${source("FIXTURE")}<p>New combined SHA-256 ${mono(d.correction.sha256.slice(0,16))}…</p><div class="review-chain"><span>New hashes</span><span>New review</span><span>New approval</span><span>New execution</span></div><p>Reviewed package exists. ${e(d.correction.policy)}. Runtime ticket is not created.</p></div></div>`;
  const scenarios = section("scenarios","08 / HAPPY, FAILURE & CORRECTION","Demonstrate the workflow, including when it stops.","The current release and expected behavior remain separate. Demo scenarios never update the live release status.",`<div class="tabs no-print" role="tablist" aria-label="Migration scenarios">${[["actual","Happy Path"],["expected","Expected Flow"],["failure","Failure Demo"],["correction","Correction Demo"]].map(([key,name],i)=>`<button class="tab" id="tab-${key}" role="tab" aria-controls="scenario-content" aria-selected="${i===0}" tabindex="${i===0 ? 0 : -1}" data-scenario="${key}">${name}</button>`).join("")}</div><div class="panel scenario-panel" id="scenario-content" role="tabpanel" aria-labelledby="tab-actual" tabindex="0"></div>${correction}<div class="callout fixture-callout"><strong>Failed history is preserved. A new reviewed release corrects it.</strong>Failure and correction are fixture demonstrations; neither runtime ticket has been created. Correction does not edit or erase the failed release.</div>`);
  const audit = section("audit","09 / AUDIT & REPORT","Follow the evidence from source to result.","Live observations may describe a pending state. Missing execution and Oracle results remain visible in the chain.",`<div class="chain">${d.chain.map((c,i)=>`<article class="chain-node"><span class="chain-order">0${i+1}</span>${source(c.source)}<h3>${e(c.title)}</h3><p>${e(c.detail)}</p></article>`).join("")}</div><div class="grid2" style="margin-top:18px"><div class="panel retention"><div class="retention-head"><h3>Execution Evidence Retention</h3>${badge(d.retention.status)}</div>${source("LIVE")} <span class="tag">LIVE POC EVIDENCE</span><div class="retention-config"><div><b>Stable hostname</b> · ${mono(d.retention.hostname)}</div><div><b>Stable ODC service identity</b></div><div><b>Persistent task logs</b> · ${mono(d.retention.mount)}</div></div><div class="retained">${Object.entries(d.retention.checks).map(([name,status])=>`<span>✓ ${e(name)} retained · ${e(status)}</span>`).join("")}</div><p class="small muted">Historical replacement test: tickets ${d.retention.tickets.map(e).join(" / ")} on ${e(date(d.retention.observed_at))}. Current retention configuration: ${e(d.retention.configuration)} at ${e(date(d.retention.configuration_observed_at))}. This is separate from batch ${e(d.odc_batch)}.</p>${link(local(d.evidence_directory + "/retention-conclusion.json"),"View historical retention proof")}</div><div><div class="panel"><h3>Evidence you can inspect</h3><ul class="evidence-links"><li>${link(local(d.evidence_directory + "/happy-odc-receipt.json"),"ODC batch observation · LIVE")}<small>Batch identity and pending stages, not completed execution</small></li><li>${link(local(d.evidence_directory + "/happy-batch-approval-state.json"),"Native approval nodes · LIVE")}<small>Review incomplete; candidates are not approvals</small></li><li>${link(local(d.evidence_directory + "/" + d.release + "/migration-report.json"),"Migration report · JSON / Markdown")}<small>Machine and audit outputs; runtime result NOT_AVAILABLE</small></li></ul></div><div class="download-card"><h3>A report ready for the handoff.</h3><p>Release provenance, approvals, rollout, verification and limitations in a formal, printable document.</p>${link("migration-report.html","Open HTML migration report →","btn")} ${link("data/demo-status.json","Dashboard data","btn")}</div></div></div>`);
  const capabilities = [["Source traceability","Weak / manual","Git"],["SQL validation","Manual","Actions"],["Target inventory","DBeaver / manual","ODC"],["Approval","Email / chat","ODC"],["Execution","DBeaver","ODC"],["Rollout","Manual","ODC batch"],["Audit","Scattered","Central"],["Report","Manual","Generated"]];
  const boundary = `<div class="grid2 boundary"><div class="panel"><h3>What ODC replaces</h3><ul>${["Manual DBeaver execution","Database target inventory","Review and approval handoffs","Multi-environment execution","Scattered execution evidence"].map(t=>`<li><span class="yes">✓</span>${t}</li>`).join("")}</ul></div><div class="panel"><h3>What ODC does NOT replace</h3><ul>${["Git and source review","Oracle DBA expertise","Backup and recovery","Schema design","Flyway-style automatic version ledger / replay semantics"].map(t=>`<li><span class="dash">—</span>${t}</li>`).join("")}</ul></div></div>`;
  const comparison = section("comparison","10 / BEFORE VS AFTER","A controlled workflow replaces the manual handoff.","Proposed capabilities centralize the process. This POC has proven the platform; the current release still awaits execution.",`<div class="grid2"><div class="panel compare-card before"><div class="eyebrow muted">BEFORE</div><h3>The DBA carries the release.</h3><p>Manual target selection, approvals and evidence collection.</p><div class="compare-flow">${["Developer","SQL file","Chat / email","DBA","DBeaver","Select DB","Run SQL","Screenshot / log"].map((s,i)=>`${i ? " → " : ""}<span>${s}</span>`).join("")}</div></div><div class="panel compare-card proposed"><div class="eyebrow" style="color:var(--teal)">PROPOSED</div><h3>The workflow carries the release.</h3><p>Reviewed source, approved targets and one evidence trail.</p><div class="compare-flow">${["Developer","Git PR","Actions validation","ODC","Review / approval","DEV / SIT / UAT / MOCKPROD","Oracle checks","Generated report"].map((s,i)=>`${i ? " → " : ""}<span>${s}</span>`).join("")}</div></div></div><div class="table-wrap comparison-table"><table><thead><tr><th>Capability</th><th>Before</th><th>ODC POC · proposed workflow</th></tr></thead><tbody>${capabilities.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${boundary}`);
  const limits = `<details class="limitations" ${report ? "open" : ""}><summary>Known limitations and operating boundaries</summary><ul>${d.limitations.map(t=>`<li>${e(t)}</li>`).join("")}</ul></details>`;
  const decision = section("decision","11 / POC DECISION","Proceed to an internal pilot.","The platform decision and the current migration result are separate, evidence-based conclusions.",`<div class="decision"><div class="decision-intro"><div><div class="eyebrow" style="color:var(--teal)">POC DECISION</div><h2>ODC is a practical platform for an internal pilot.</h2><p>Source validation and retention are proven. Finish controlled runtime acceptance during the pilot.</p></div><span class="badge good">GO FOR INTERNAL PILOT</span></div><div class="decision-grid">${[["ODC Practical Platform","GO FOR INTERNAL PILOT","Historical practical POC + retention proof"],["GitHub Actions Integration","IMPLEMENTED","Validation + package + fixture report; live handoff pending"],["Live Happy Migration",label(d.overall_status),`${d.happy_path} evidence · batch ${d.odc_batch}`],["Failure / Correction Runtime","NOT AVAILABLE","Fixture demonstrations; no runtime tickets"],["Production Rollout","NOT APPROVED","MOCKPROD is an isolated POC schema"]].map(([name,status,desc])=>`<div class="decision-item"><small>${name}</small><b>${e(status)}</b><p>${e(desc)}</p></div>`).join("")}</div></div>${limits}`);
  const footer = `<footer class="footer"><span>DATABASE MIGRATION POC · ${e(d.repository)} · offline snapshot</span><span>Generated ${e(date(d.generated_at))} · Evidence sources remain explicit</span></footer>`;
  const presentationControls = `<div class="presentation-controls" aria-label="Presentation navigation"><button class="btn" id="prev-section">← Previous</button><span id="section-position">1 / 11</span><button class="btn" id="next-section">Next →</button><button class="btn" id="exit-presentation">Exit</button></div>`;

  function reportContent() {
    const summary = section("summary","01 / EXECUTIVE SUMMARY",d.runtime_proven ? "Current release is verified." : allWaiting ? "Current release awaits human approval." : "Current release requires evidence review.","Snapshot of the migration result, distinct from platform feasibility.",`<div class="report-summary"><div class="status-line">${badge(d.overall_status)}${source("LIVE")}<span class="small">${e(d.happy_path)} LIVE COVERAGE</span></div><p><strong>${e(d.release)}</strong> for <strong>${e(d.application)}</strong> has passed GitHub validation and was submitted to ODC as batch <strong>${e(d.odc_batch)}</strong>. The implementation PR is merged.</p><p>${e(approvalDescription)} ${e(runtimeDescription)} ${noOracle ? "No post-migration Oracle verification is available." : "Recorded Oracle checks are shown in the verification panel."}</p><p style="margin:0">The ODC practical platform is ready for an internal pilot. Historical execution evidence retention passed. Failure and correction behavior is demonstrated with explicitly labelled fixtures. Production rollout is not approved.</p></div>`);
    const reportInfo = section("report-release","02 / RELEASE INFORMATION","Release and batch identity","Original source provenance is preserved across later implementation commits.",`<div class="panel">${kv([["Application",e(d.application)],["Release",mono(d.release)],["ODC batch",`${mono(d.odc_batch)} · ${e(d.native_status)} ${source("LIVE")}`],["Environment flow","DEV → SIT → UAT → MOCKPROD"],["Current execution",e(currentExecution)],["Runtime result",badge(d.runtime_proven ? "VERIFIED" : "NOT_AVAILABLE")],["Observation time",e(date(d.observed_at))]])}</div>`);
    const reportSource = section("report-source","03 / SOURCE PROVENANCE","GitHub provenance and validation","PR and workflow observations are live; report workflow contents are fixtures.",`<div class="panel">${kv([["Repository",githubLink(`https://github.com/${d.repository}`,d.repository)],["PR",`${githubLink(d.github.pr.html_url,`#${d.github.pr.number}`)} · ${d.github.pr.merged ? "MERGED" : e(d.github.pr.state)}`],["Batch source",mono(d.provenance.source_commit)],["PR head",mono(d.provenance.pr_head)],["Merge commit",mono(d.provenance.merge_commit)],["Tests",`${e(d.github.tests || "Count not available")} ${d.github.tests ? "PASS" : ""}`],["Release package",`${e(d.github.package_status)} · artifact ${e(d.github.artifact_id)}`],["Batch package origin",`${e(d.provenance.package_origin)}; Actions run ${e(d.provenance.github_run)}`]])}</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Check</th><th>Result / source</th><th>Run / scope</th></tr></thead><tbody>${d.github.workflows.map(w=>`<tr><td>${e(w.name)}</td><td>${badge(w.status)} ${source(w.source)}</td><td>${githubLink(w.url,w.run)}<br><small>${e(w.scope)}</small></td></tr>`).join("")}</tbody></table></div>`);
    const reportFiles = section("report-files","04 / MIGRATION FILES","Six ordered, immutable migrations","SHA-256 values are validated against the reviewed files before generating this report.",`<div class="table-wrap"><table><thead><tr><th>File</th><th>Type / policy</th><th>SHA-256</th></tr></thead><tbody>${d.files.map(f=>`<tr><td>${link(local(f.path),f.file)}</td><td>${e(f.type)} ${badge(f.policy)}</td><td><code class="full-hash">${e(f.sha256)}</code></td></tr>`).join("")}</tbody></table></div>`);
    const reportApprovals = approvals.replace("05 / REVIEW & APPROVAL","05 / APPROVAL");
    const reportRollout = rollout;
    const reportVerification = verification;
    const reportEvidence = section("report-evidence","08 / EXECUTION EVIDENCE","Migration evidence; retention proven historically.","Availability of current execution and Oracle results is shown separately from historical retention evidence.",`<div class="table-wrap"><table><thead><tr><th>Evidence</th><th>Source</th><th>Finding</th></tr></thead><tbody>${d.chain.map(c=>`<tr><td>${e(c.title)}</td><td>${source(c.source)}</td><td>${e(c.detail)}</td></tr>`).join("")}</tbody></table></div><div class="panel" style="margin-top:14px"><h3>Execution Evidence Retention ${badge(d.retention.status)} ${source("LIVE")}</h3><p class="small">Historical tickets ${d.retention.tickets.map(e).join(" / ")} retained result, log, attachment, metadata and audit after replacement. Stable hostname <code>odc</code>, stable ODC service identity, persistent <code>/opt/odc/log</code>. Current configuration ${e(d.retention.configuration)} at ${e(date(d.retention.configuration_observed_at))}.</p><div class="retained">${Object.keys(d.retention.checks).map(name=>`<span>✓ ${e(name)} retained</span>`).join("")}</div></div>`);
    const reportFailure = section("report-failure","09 / FAILURE / CORRECTION","A correction is a new release.","FIXTURE DEMONSTRATION — failure and correction runtime have not run.",`<div class="callout fixture-callout" style="margin-top:0"><strong>${e(d.correction.failed_release)} · ORA-20042 at SIT</strong>Fixture progression: DEV VERIFIED → SIT FAILED → UAT WAITING → MOCKPROD WAITING. Further rollout stops. No live failure batch exists.</div>${correction}<p class="small" style="margin-top:14px">Failed history is preserved. A new reviewed release corrects it. The correction fixture verifies all four environments under a new sample batch; no live correction is claimed.</p>`);
    const reportResult = section("report-result","10 / FINAL RESULT",`Internal pilot: GO. Current migration: ${e(label(d.overall_status))}.`,"A proven platform does not imply this release has executed.",`<div class="table-wrap"><table><thead><tr><th>Decision</th><th>Result</th></tr></thead><tbody><tr><td>ODC Practical Platform</td><td>GO FOR INTERNAL PILOT</td></tr><tr><td>GitHub Actions Integration</td><td>IMPLEMENTED; authenticated handoff pending</td></tr><tr><td>Live Happy Migration</td><td>${e(label(d.overall_status))} · ${e(d.happy_path)} LIVE COVERAGE</td></tr><tr><td>Failure / Correction Runtime</td><td>NOT AVAILABLE · FIXTURE demonstrations</td></tr><tr><td>Retention</td><td>LIVE PASS · historical execution evidence</td></tr><tr><td>Production Rollout</td><td>NOT APPROVED</td></tr></tbody></table></div>`);
    const reportLimits = section("report-limits","11 / KNOWN LIMITATIONS","Operating and evidence boundaries","This report supports the POC and internal pilot decision.",`<div class="panel"><ul class="small" style="padding-left:18px;margin:0">${d.limitations.map(t=>`<li style="margin-bottom:8px">${e(t)}</li>`).join("")}</ul></div>`);
    const sourceIndex = section("report-index","APPENDIX / SOURCE INDEX","Evidence references","The generated JSON contains full SHA-256 values for these evidence inputs.",`<div class="table-wrap sources-table"><table><thead><tr><th>Evidence source</th><th>SHA-256</th></tr></thead><tbody>${d.sources.map(s=>`<tr><td>${link(local(s.file),s.file)}</td><td><code>${e(s.sha256.slice(0,16))}…</code></td></tr>`).join("")}</tbody></table></div><p class="no-print-hint" style="margin-top:12px">Print this report using your browser’s Print → Save as PDF. Enable background graphics for the badge colors. Status text remains readable in monochrome.</p>`);
    return `<div class="report-toolbar no-print">${link("index.html","← Open visual dashboard","btn")}<button class="btn primary" id="print-report">Print / Save PDF</button></div><main class="report-main" id="main"><header class="report-header"><div class="eyebrow">DATABASE MIGRATION REPORT · POC</div><h1>customer-profile<br><span style="color:var(--teal)">Migration release report</span></h1><p class="muted">${e(d.release)} · ODC batch ${e(d.odc_batch)} · DEV → SIT → UAT → MOCKPROD</p><div class="report-meta"><span>Repository: ${e(d.repository)}</span><span>Snapshot: ${e(date(d.observed_at))}</span></div></header>${snapshot}${summary}${reportInfo}${reportSource}${reportFiles}${reportApprovals}${reportRollout}${reportVerification}${reportEvidence}${reportFailure}${reportResult}${reportLimits}${sourceIndex}${footer}</main>`;
  }
  document.getElementById("app").innerHTML = report ? reportContent() : `${sidebar}${topbar}<main class="main" id="main">${hero}${snapshot}${problem}${architecture}${release}${github}${approvals}${rollout}${verification}${scenarios}${audit}${comparison}${decision}${footer}</main>${presentationControls}`;
  if (report) {
    document.getElementById("print-report").addEventListener("click", () => window.print());
    return;
  }

  function renderScenario(key) {
    const scenario = key === "actual" ? {release:d.release,source:"LIVE",environments:d.environments} : d.fixtures[key];
    const titles = {actual:`CURRENT REAL STATUS · ${d.happy_path} LIVE COVERAGE`,expected:"EXPECTED FLOW · FIXTURE DEMONSTRATION",failure:"FIXTURE DEMONSTRATION · FAILURE AT SIT",correction:"FIXTURE DEMONSTRATION · NEW CORRECTION RELEASE"};
    const desc = {actual:runtimeDescription,expected:"This is the expected completed sequence from the happy fixture, not current runtime.",failure:"DEV verifies. SIT fails with ORA-20042. UAT and MOCKPROD remain waiting.",correction:"A new reviewed release and sample batch correct the preserved failure. No live correction has run."};
    document.querySelectorAll("[data-scenario]").forEach(t => {t.setAttribute("aria-selected",String(t.dataset.scenario === key));t.tabIndex=t.dataset.scenario === key ? 0 : -1;});
    const panel = document.getElementById("scenario-content");
    panel.setAttribute("aria-labelledby", "tab-" + key);
    panel.innerHTML = `<div class="scenario-banner"><div><div class="eyebrow" style="color:${key === "actual" ? "var(--teal)" : "var(--blue)"}">${e(titles[key])}</div><div class="release-id">${e(scenario.release)}</div><p>${e(desc[key])}</p></div>${source(scenario.source)}</div>${pipeline(scenario.environments)}<div class="scenario-copy">${key === "failure" ? `${badge("CORRECTION_REQUIRED")} <strong style="color:var(--red)">ORA-20042</strong> · preserve results, stop rollout and submit a new correction release.` : key === "correction" ? `<strong>New hashes → new review → new approval → new execution.</strong> The fixture correction reuses an existing DEV index and adds it where missing.` : key === "expected" ? `${badge("VERIFIED")} ${source("FIXTURE")} Every stage needs independent Oracle acceptance before continuation.` : `${badge(d.overall_status)} The current view reflects recorded approval, execution and Oracle evidence.`}</div>`;
  }
  renderScenario("actual");
  document.querySelectorAll("[data-scenario]").forEach(t => t.addEventListener("click", () => renderScenario(t.dataset.scenario)));
  document.querySelector(".tabs").addEventListener("keydown", event => {
    if (!["ArrowRight","ArrowLeft","Home","End"].includes(event.key)) return;
    const tabs = [...document.querySelectorAll("[data-scenario]")];
    const index = tabs.indexOf(document.activeElement);
    const next = event.key === "Home" ? 0 : event.key === "End" ? tabs.length-1 : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    event.preventDefault(); renderScenario(tabs[next].dataset.scenario); tabs[next].focus();
  });
  let present = false, position = 0;
  const sections = navItems.map(([id]) => document.getElementById(id));
  function updatePosition() {
    document.getElementById("section-position").textContent = `${position+1} / ${sections.length} · ${navItems[position][1]}`;
    document.getElementById("prev-section").disabled = position===0;
    document.getElementById("next-section").disabled = position===sections.length-1;
    document.querySelectorAll(".nav a").forEach((a,i)=>a.classList.toggle("active",i===position));
  }
  function move(step) {position=Math.max(0,Math.min(sections.length-1,position+step));sections[position].scrollIntoView({block:"start"});updatePosition();}
  function togglePresentation(value) {
    present=value;document.body.classList.toggle("presentation",present);
    document.getElementById("presentation").setAttribute("aria-pressed",String(present));
    document.getElementById("presentation").textContent=present ? "Exit presentation" : "Presentation mode";
    if (present) {position=0;move(0);}
  }
  document.getElementById("presentation").addEventListener("click",()=>togglePresentation(!present));
  document.getElementById("exit-presentation").addEventListener("click",()=>togglePresentation(false));
  document.getElementById("prev-section").addEventListener("click",()=>move(-1));
  document.getElementById("next-section").addEventListener("click",()=>move(1));
  document.addEventListener("keydown",event=>{
    if (!present || ["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName) || event.target.closest(".tabs")) return;
    if (event.key==="Escape") togglePresentation(false);
    else if (["ArrowRight","PageDown"].includes(event.key)) {event.preventDefault();move(1);}
    else if (["ArrowLeft","PageUp"].includes(event.key)) {event.preventDefault();move(-1);}
  });
  const observer = new IntersectionObserver(entries=>{
    const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if (visible.length) {position=sections.indexOf(visible[0].target);updatePosition();}
  },{rootMargin:"-10% 0px -55% 0px",threshold:0});
  sections.forEach(s=>observer.observe(s));updatePosition();
})();
</script>
</body>
</html>
