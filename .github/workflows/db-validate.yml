name: DB migration validation

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'scripts/db_demo/**'
      - '.github/workflows/db-*.yml'

permissions:
  contents: read

concurrency:
  group: db-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install bounded YAML dependency
        run: python -m pip install -r scripts/db_demo/requirements.txt
      - name: Validate changed releases and immutable files
        run: python -m scripts.db_demo.validate_manifest --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --output "$RUNNER_TEMP/db-demo/validation"
      - name: Unit tests
        run: python -m unittest discover -s scripts/db_demo/tests -v
      - name: Verify standalone visual POC and recorded evidence hashes
        run: python -m scripts.db_demo.verify_dashboard --output "$RUNNER_TEMP/db-demo/visual-checks"
      - name: Build releases and render fixture reports
        shell: bash
        run: |
          set -euo pipefail
          for release_id in REL-2026.10-DEMO01 REL-2026.10-DEMO02-FAIL REL-2026.10-DEMO02-FIX; do
            release_dir="$RUNNER_TEMP/db-demo/releases/$release_id"
            python -m scripts.db_demo.build_release --release-id "$release_id" --output "$release_dir"
            python -m scripts.db_demo.collect_evidence --bundle "$release_dir" --source FIXTURE --output "$release_dir/evidence.json"
            python -m scripts.db_demo.generate_report --evidence "$release_dir/evidence.json" --output "$release_dir/reports"
          done
      - name: Probe existing ODC network boundary without credentials
        env:
          ODC_DEMO_PROBE_URL: ${{ vars.ODC_DEMO_PROBE_URL }}
        run: python -m scripts.db_demo.probe_connectivity --output "$RUNNER_TEMP/db-demo/runner-connectivity.json"
      - name: Upload validation, release envelopes and fixture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-demo-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/db-demo/
          if-no-files-found: error
          retention-days: 30
      - name: Artifact link
        if: always()
        run: echo "Artifacts and job logs are available in [this workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >> "$GITHUB_STEP_SUMMARY"
