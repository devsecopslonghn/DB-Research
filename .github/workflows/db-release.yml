name: DB migration release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Git-controlled migration release
        required: true
        type: choice
        options:
          - REL-2026.10-DEMO01
          - REL-2026.10-DEMO02-FAIL
          - REL-2026.10-DEMO02-FIX
      operation:
        description: Prepare artifact or hand off/read ODC; never approve or execute
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - create_odc_change
          - collect_status

permissions:
  contents: read
  actions: read

concurrency:
  group: db-release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/db_demo/requirements.txt
      - name: Require reviewed main for live integration
        if: inputs.operation != 'prepare' && github.ref != 'refs/heads/main'
        run: |
          echo "BLOCKED: live ODC handoff requires reviewed main; preparation remains available on a feature branch." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - run: python -m scripts.db_demo.validate_manifest --release-id "$RELEASE_ID" --output "$RUNNER_TEMP/validation"
      - name: Prepare exact source artifact
        if: inputs.operation != 'collect_status'
        run: python -m scripts.db_demo.build_release --release-id "$RELEASE_ID" --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.operation != 'collect_status'
        with:
          name: db-release-${{ inputs.release_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          retention-days: 30
      - run: |
          echo "Release **$RELEASE_ID**, operation **$OPERATION**. Artifact/job details: [workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Approval and execution remain in ODC." >> "$GITHUB_STEP_SUMMARY"

  odc:
    if: inputs.operation != 'prepare' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: [self-hosted, linux, odc-demo]
    environment: odc-demo
    timeout-minutes: 15
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      ODC_BASE_URL: ${{ secrets.ODC_BASE_URL }}
      ODC_USERNAME: ${{ secrets.ODC_USERNAME }}
      ODC_PASSWORD: ${{ secrets.ODC_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/db_demo/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation == 'create_odc_change'
        with:
          name: db-release-${{ inputs.release_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff/
      - name: Locate existing handoff for collection
        id: existing
        if: inputs.operation == 'collect_status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_demo.github_artifacts --release-id "$RELEASE_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation == 'collect_status'
        with:
          name: ${{ steps.existing.outputs.name }}
          run-id: ${{ steps.existing.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/handoff/
      - name: Create pending ODC native batch
        if: inputs.operation == 'create_odc_change'
        run: python -m scripts.db_demo.odc_client --operation create_odc_change --bundle "$RUNNER_TEMP/handoff" --output "$RUNNER_TEMP/handoff"
      - name: Read the existing native batch
        if: inputs.operation == 'collect_status'
        run: |
          ticket_id=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/handoff/odc-created.json"))["odc_batch_id"])')
          python -m scripts.db_demo.odc_client --operation collect_status --bundle "$RUNNER_TEMP/handoff" --ticket-id "$ticket_id" --output "$RUNNER_TEMP/handoff"
      - name: Retain handoff and original envelope even if collection fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odc-handoff-${{ inputs.release_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 30
