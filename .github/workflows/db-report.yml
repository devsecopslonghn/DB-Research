name: DB migration report

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'scripts/db_demo/**'
      - '.github/workflows/db-*.yml'
  workflow_dispatch:
    inputs:
      release_id:
        description: Reviewed release
        required: true
        type: choice
        options:
          - REL-2026.10-DEMO01
          - REL-2026.10-DEMO02-FAIL
          - REL-2026.10-DEMO02-FIX
      evidence_source:
        description: Fixtures are labeled samples; LIVE needs existing ODC handoff
        type: choice
        required: true
        default: FIXTURE
        options: [FIXTURE, LIVE]

permissions:
  contents: read
  actions: read

jobs:
  live-source-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_source == 'LIVE' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "BLOCKED: LIVE evidence collection requires reviewed main." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  fixture-report:
    if: github.event_name == 'pull_request' || inputs.evidence_source == 'FIXTURE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_ID: ${{ inputs.release_id || 'REL-2026.10-DEMO01' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/db_demo/requirements.txt
      - run: python -m scripts.db_demo.build_release --release-id "$RELEASE_ID" --output "$RUNNER_TEMP/report-release"
      - run: python -m scripts.db_demo.collect_evidence --bundle "$RUNNER_TEMP/report-release" --source FIXTURE --output "$RUNNER_TEMP/report-release/evidence.json"
      - run: python -m scripts.db_demo.generate_report --evidence "$RUNNER_TEMP/report-release/evidence.json" --output "$RUNNER_TEMP/report-release/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-demo-report-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/report-release/
          retention-days: 30
      - run: |
          echo "Fixture report artifacts: [workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Evidence source **FIXTURE**, runtime result **NOT_AVAILABLE**." >> "$GITHUB_STEP_SUMMARY"

  live-report:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_source == 'LIVE' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, odc-demo]
    environment: odc-demo
    timeout-minutes: 15
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      ODC_BASE_URL: ${{ secrets.ODC_BASE_URL }}
      ODC_USERNAME: ${{ secrets.ODC_USERNAME }}
      ODC_PASSWORD: ${{ secrets.ODC_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/db_demo/requirements.txt
      - name: Locate immutable handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_demo.github_artifacts --release-id "$RELEASE_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.handoff.outputs.name }}
          run-id: ${{ steps.handoff.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/live-report/
      - name: Collect ODC status
        run: |
          ticket_id=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/live-report/odc-created.json"))["odc_batch_id"])')
          python -m scripts.db_demo.odc_client --operation collect_status --bundle "$RUNNER_TEMP/live-report" --ticket-id "$ticket_id" --output "$RUNNER_TEMP/live-report"
      - name: Oracle SELECT-only assertions for completed targets
        run: python -m scripts.db_demo.verify_oracle --bundle "$RUNNER_TEMP/live-report" --source LIVE --receipt "$RUNNER_TEMP/live-report/odc-receipt.json" --output "$RUNNER_TEMP/live-report/oracle-verification.json"
      - name: Collect sanitized evidence
        run: python -m scripts.db_demo.collect_evidence --bundle "$RUNNER_TEMP/live-report" --source LIVE --receipt "$RUNNER_TEMP/live-report/odc-receipt.json" --verification "$RUNNER_TEMP/live-report/oracle-verification.json" --output "$RUNNER_TEMP/live-report/evidence.json"
      - name: Render migration report
        run: python -m scripts.db_demo.generate_report --evidence "$RUNNER_TEMP/live-report/evidence.json" --output "$RUNNER_TEMP/live-report/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: db-demo-report-live-${{ github.run_id }}
          path: ${{ runner.temp }}/live-report/
          retention-days: 30
      - if: always()
        run: |
          echo "Live report/evidence artifacts: [workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Check every Oracle result before continuing ODC." >> "$GITHUB_STEP_SUMMARY"
